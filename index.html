<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HábitoTracker</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="cabecera">
    <h1>HábitoTracker</h1>
    <p class="subtitulo">Gestor de hábitos con registros y tabla de seguimiento</p>
  </header>

  <main class="contenido">

    <!-- FORMULARIO A · Crear hábitos -->
    <section class="tarjeta">
      <h2>Nuevo hábito</h2>
      <form id="formHabito" novalidate>
        <label for="habNombre">Nombre *</label>
        <input type="text" id="habNombre" maxlength="40" placeholder="Ej: Beber 2 litros de agua">

        <label for="habDescripcion">Descripción</label>
        <textarea id="habDescripcion" rows="2" maxlength="120" placeholder="Opcional"></textarea>

        <label for="habCategoria">Categoría</label>
        <select id="habCategoria">
          <option value="Salud">Salud</option>
          <option value="Estudio">Estudio</option>
          <option value="Ocio">Ocio</option>
          <option value="Deporte">Deporte</option>
          <option value="Trabajo">Trabajo</option>
        </select>

        <p class="error" id="errorHabito"></p>
        <button type="submit" class="boton">Crear hábito</button>
      </form>

      <h3>Mis hábitos</h3>
      <ul id="listaHabitos" class="lista"></ul>
    </section>

    <!-- FORMULARIO B · Registrar días -->
    <section class="tarjeta">
      <h2>Registrar un día</h2>
      <form id="formRegistro" novalidate>
        <label for="regHabito">Hábito *</label>
        <select id="regHabito">
          <!-- Las opciones se generan por código desde el array habitos -->
        </select>

        <label for="regFecha">Fecha *</label>
        <input type="date" id="regFecha">

        <label for="regObservaciones">Observaciones</label>
        <textarea id="regObservaciones" rows="2" maxlength="120" placeholder="¿Cómo ha ido?"></textarea>

        <label class="casilla">
          <input type="checkbox" id="regCumplido" checked>
          Cumplido
        </label>

        <p class="error" id="errorRegistro"></p>
        <button type="submit" class="boton">Guardar registro</button>
      </form>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
